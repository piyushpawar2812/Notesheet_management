<form method="POST">

    {% csrf_token %}

    <input type="hidden"
           name="action"
           value="save_quotation">

    <div class="mb-3">

        <label>Item Name</label>

        <input type="text"
               name="item_name"
               class="form-control">

    </div>

    <div class="mb-3">

        <label>Quantity</label>

        <input type="number"
               name="quantity"
               class="form-control">

    </div>

    <div class="mb-3">

        <label>Unit Price</label>

        <input type="number"
               step="0.01"
               name="unit_price"AAAAA
               class="form-control">

    </div>

    <button class="btn btn-primary">

        Save Item

    </button>

</form>
