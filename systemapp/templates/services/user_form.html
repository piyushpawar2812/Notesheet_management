{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-dark text-white">

            <h4>

                {% if user_obj %}
                    Edit User
                {% else %}
                    Create User
                {% endif %}

            </h4>

        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Login ID

                        </label>

                        <input
                            type="text"
                            name="login_id"
                            class="form-control"
                            value="{{ user_obj.login_id|default:'' }}"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="text"
                            name="password"
                            class="form-control"
                            value="{{ user_obj.password|default:'' }}"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Role

                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            {% for role in roles %}

                            <option
                                value="{{ role.id }}"
                                {% if user_obj.role.id == role.id %}
                                    selected
                                {% endif %}
                            >
                                {{ role.role_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Officer Name

                        </label>

                        <input
                            type="text"
                            name="officer_name"
                            class="form-control"
                            value="{{ user_obj.officer_name|default:'' }}"
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            College

                        </label>

                        <select
                            name="collage"
                            class="form-select"
                        >

                            <option value="">
                                Select College
                            </option>

                            {% for collage in collages %}

                            <option
                                value="{{ collage.id }}"
                                {% if user_obj.collage.id == collage.id %}
                                    selected
                                {% endif %}
                            >
                                {{ collage }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Designation

                        </label>

                        <input
                            type="text"
                            name="designation"
                            class="form-control"
                            value="{{ user_obj.designation|default:'' }}"
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Mobile Number

                        </label>

                        <input
                            type="number"
                            name="mobile_no"
                            class="form-control"
                            value="{{ user_obj.mobile_no|default:'' }}"
                        >

                    </div>

                    <div class="col-md-6 mb-3 d-flex align-items-center">

                        <div class="form-check mt-4">

                            <input
                                type="checkbox"
                                name="status"
                                class="form-check-input"
                                {% if user_obj.status or not user_obj %}
                                    checked
                                {% endif %}
                            >

                            <label class="form-check-label">

                                Active

                            </label>

                        </div>

                    </div>

                </div>

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Save User
                    </button>

                    <a href="{% url 'user_list' %}"
                       class="btn btn-secondary">
                        Back
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
