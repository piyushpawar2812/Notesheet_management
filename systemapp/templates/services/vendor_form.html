<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="vendor_name"
           placeholder="Vendor Name"
           class="form-control mb-2">

    <input type="text"
           name="gst_number"
           placeholder="GST Number"
           class="form-control mb-2">

    <input type="number"
           step="0.01"
           name="quote_price"
           placeholder="Quote Price"
           class="form-control mb-2">

    <input type="number"
           step="0.01"
           name="unit_price"
           placeholder="Unit Price"
           class="form-control mb-2">

    <button class="btn btn-success">

        Save Vendor

    </button>

</form>
